name: CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Validate Quran dataset
        run: go run ./scripts/validate

      - name: Validate translations
        run: go run ./scripts/validate_translations

      - name: Build server
        run: go build ./cmd/server
