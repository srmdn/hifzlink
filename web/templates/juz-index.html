<!doctype html>
<html lang="{{if eq .Lang "id"}}id{{else}}en{{end}}">
{{template "head" .}}
<body class="learning-page catalog-page juz-index-shell">
{{template "topbar" .}}
<main class="learning-content">
  <p class="catalog-kicker">{{.UI.byJuz}}</p>
  <h1>{{.UI.juzTitle}}</h1>
  <p class="catalog-intro">{{.UI.juzDescription}}</p>
  <div class="juz-index-grid" aria-label="{{.UI.juzTitle}}">
    {{range .Juzs}}
    <a class="juz-index-card{{if gt .RelationCount 0}} has-pairs{{end}}" href="/juz/{{.Number}}?lang={{$.Lang}}" aria-label="{{$.UI.juz}} {{.Number}}, {{.RelationCount}} {{$.UI.pair}}">
      <span class="juz-index-num">{{printf "%02d" .Number}}</span>
      {{if gt .RelationCount 0}}<span class="juz-index-badge">{{.RelationCount}} {{$.UI.pair}}</span>{{else}}<span class="juz-index-empty">{{$.UI.noPairs}}</span>{{end}}
    </a>
    {{end}}
  </div>
</main>
{{template "site-footer" .}}
</body>
</html>
