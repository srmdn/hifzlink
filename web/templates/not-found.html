<!doctype html>
<html lang="{{if eq .Lang "id"}}id{{else}}en{{end}}">
{{template "head" .}}
<body class="learning-page catalog-page not-found-page">
{{template "topbar" .}}

  <main class="learning-content not-found-content">
      <p class="catalog-kicker">{{.UI.notFoundKicker}}</p>
      <h1>{{.Heading}}</h1>
      <p class="catalog-intro">{{.Message}}</p>
      <a class="catalog-button" href="{{.SearchURL}}">{{.UI.searchAnother}} <span aria-hidden="true">→</span></a>
  </main>

{{template "site-footer" .}}
</body>
</html>
